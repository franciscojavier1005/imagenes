<style>
  :root{--azul:#0f2a5c;--oro:#f0c000;--fondo:#eef3fa;--texto:#1b2430}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:var(--texto);min-height:100vh}
  header{background:linear-gradient(135deg,#0b2350 0%,#1b4a8f 100%);color:#fff;padding:22px 16px 18px;text-align:center;border-bottom:4px solid var(--oro);box-shadow:0 2px 10px rgba(11,35,80,.35)}
  header img{width:78px;height:76px;border-radius:12px}
  header h1{margin:10px 0 2px;font-size:21px} header p{margin:0;font-size:14px;opacity:.9}
  main{max-width:560px;margin:0 auto;padding:18px 14px 30px}
  .saludo{font-size:15px;color:#345;margin:2px 0 14px;text-align:center}
  a.boton{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--azul);background:#fff;border:2px solid #d5dbe3;border-left:8px solid var(--oro);border-radius:16px;padding:18px 16px;margin:14px 0;box-shadow:0 2px 8px rgba(15,42,92,.10)}
  a.boton:active{transform:scale(.99);background:#f6f9ff}
  a.boton .ic{font-size:34px;line-height:1}
  a.boton b{display:block;font-size:19px} a.boton span{font-size:13.5px;color:#456}
  .pie{text-align:center;font-size:12px;color:#678;margin-top:22px}
  .espera{text-align:center;padding:24px;color:#456}
</style>

<main>
  <div class="saludo" id="saludo">¿Qué desea hacer?</div>
  <div id="botones"><div class="espera">Cargando…</div></div>
  <div class="pie">Toque una opción. Para volver aquí use «Menú» en la parte de arriba de cada pantalla.</div>
</main>
<script>
window.google={script:{run:new Proxy({},{get:function(_,k){var ok=null,self={withSuccessHandler:function(f){ok=f;return self;},withFailureHandler:function(){return self;}};
  var fn=function(){setTimeout(function(){ok(k==='urlBase'?'#vista-previa':{rol:'directivo',nombre:'Francisco Javier Cortés'});},10);};
  return k==='withSuccessHandler'||k==='withFailureHandler'?self[k]:fn;}})}};
</script>
<script>
var BASE='';
function el(id){return document.getElementById(id);}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function boton(p,ic,t,d){ return '<a class="boton" target="_top" href="'+esc(BASE+'?p='+p)+'"><span class="ic">'+ic+'</span><div><b>'+t+'</b><span>'+d+'</span></div></a>'; }
function pintar(rol,nombre){
  var h='';
  if(rol==='directivo'){
    el('saludo').textContent='Bienvenido(a)'+(nombre?', '+nombre:'')+'. ¿Qué desea hacer?';
    h+=boton('ronda','📋','Ronda de aula','Lo normal: verificar quién está en clase (por bloque).');
    h+=boton('reunion','👥','Reuniones y jornadas','Asistencia de reuniones, jornada pedagógica, consejos y comités.');
    h+=boton('panel','📊','Panel e informes','Ver cifras, tendencias y el informe del periodo.');
  } else {
    el('saludo').textContent='Bienvenido(a). Toque para continuar.';
    h+=boton('panel','📊','Mi informe y mis soportes','Ver mi asistencia, cargar soportes o pedir acceso.');
  }
  el('botones').innerHTML=h;
}
function iniciar(){
  var listo=false;
  try{
    google.script.run.withSuccessHandler(function(u){ BASE=u||''; 
      google.script.run.withSuccessHandler(function(c){ listo=true; pintar(c&&c.rol,c&&c.nombre); })
        .withFailureHandler(function(){ pintar('directivo',''); }).contextoPanel();
    }).withFailureHandler(function(){ pintar('directivo',''); }).urlBase();
  }catch(e){ pintar('directivo',''); }
}
iniciar();
</script>
