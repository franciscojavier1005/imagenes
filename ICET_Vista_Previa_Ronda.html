<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICET - Vista previa de la ronda</title>
<style>
  :root{--azul:#1F4E78;--ok:#2e7d32;--no:#c62828;--tarde:#b26a00;--fondo:#f3f5f8;--borde:#d5dbe3;--texto:#1b2430}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:var(--texto);padding-bottom:84px}
  header{background:var(--azul);color:#fff;padding:6px 10px;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:13px;font-weight:600;opacity:.9}
  .fila{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
  .sesion{font-size:17px;font-weight:700}
  .chip{background:rgba(255,255,255,.18);border-radius:14px;padding:2px 8px;font-size:12px}
  button,select,input[type=text],input[type=search]{font:inherit}
  .nav{background:#fff;color:var(--azul);border:0;border-radius:8px;padding:6px 10px;font-weight:700;font-size:15px;min-height:40px}
  .ahora{background:#ffd54f;color:#3b2e00}
  select{padding:6px;border-radius:8px;border:0;min-height:40px;font-size:14px}
  main{padding:10px 10px 0}
  .buscar{width:100%;padding:11px;border-radius:10px;border:1px solid var(--borde);margin-bottom:8px;font-size:16px}
  .quien{font-size:14px;margin:4px 0 8px}
  .grupo{background:#fff;border:1px solid var(--borde);border-radius:12px;margin:10px 0;overflow:hidden}
  .grupo>h2{margin:0;padding:9px 12px;background:#e6edf5;font-size:16px;display:flex;justify-content:space-between;align-items:center}
  .grupo>h2 small{font-weight:400;color:#456}
  .dirgrupo{padding:4px 12px;font-size:12px;color:#456;background:#f4f8fc;border-top:1px solid #e3e9f0}
  .doc{padding:10px 12px;border-top:1px solid #eef1f5;scroll-margin-top:140px;scroll-margin-bottom:100px}
  .detalle label{scroll-margin-top:140px;scroll-margin-bottom:100px}
  .doc.estado-No{background:#fdecea} .doc.estado-Tarde{background:#fff6e0} .doc.estado-Presente{background:#edf7ee}
  .nombre{font-weight:600;font-size:16px}
  .meta{font-size:13px;color:#566}
  .nota{font-size:12px;color:#7a5200;margin-top:2px}
  .reporte{font-size:12.5px;background:#fff3cd;color:#664d03;border-radius:8px;padding:6px 9px;margin-top:6px}
  .previo{font-size:12px;color:#555;margin-top:2px}
  .detalle{margin-top:8px;padding:8px 10px 10px;background:#fff;border:1px dashed var(--borde);border-radius:10px}
  .sel{width:100%;margin-top:8px;padding:12px 10px;font-size:16px;border:2px solid var(--borde);border-radius:10px;background:#fff;min-height:48px}
  .sel.est{font-weight:600}
  .sel:disabled{background:#eceff3;color:#8a94a0;border-style:dashed}
  .doc.estado-Presente .sel.est{border-color:var(--ok)} .doc.estado-No .sel.est{border-color:var(--no)} .doc.estado-Tarde .sel.est{border-color:var(--tarde)}
  .rej{display:grid;grid-template-columns:1fr;gap:2px}
  @media(min-width:640px){.rej{grid-template-columns:1fr 1fr}}
  .detalle label{display:block;font-size:13px;color:#456;margin-top:6px}
  .detalle .sel{margin-top:3px}
  .obs{width:100%;margin-top:3px;padding:11px;border:2px solid var(--borde);border-radius:10px;font-size:16px}
  .barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);padding:8px 10px;display:flex;gap:8px;align-items:center;z-index:6}
  .barra .cuenta{flex:1;font-size:13px}
  .barra button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:15px;min-height:46px}
  .todos{background:#e8f5e9;color:var(--ok)} .guardar{background:var(--azul);color:#fff}
  .guardar:disabled{opacity:.5}
  .aviso{padding:30px 14px;text-align:center;color:#456;font-size:16px}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9;display:none}
</style>
</head>
<body>
<header>
  <h1>Ronda docente · ICET 2026 <a id="irPanel" href="#" target="_top" style="display:none;color:#ffd54f;font-size:13px;margin-left:10px">Ver panel</a></h1>
  <div class="fila">
    <button class="nav" onclick="mover(-1)" aria-label="Sesión anterior">◀</button>
    <span class="sesion" id="sesion">…</span>
    <button class="nav" onclick="mover(1)" aria-label="Sesión siguiente">▶</button>
    <select id="dia" onchange="cambiaDia()" aria-label="Día">
      <option>LUNES</option><option>MARTES</option><option>MIERCOLES</option><option>JUEVES</option><option>VIERNES</option>
    </select>
    <button class="nav ahora" onclick="ahora()">Ahora</button>
  </div>
  <div class="fila"><span class="chip" id="franja"></span><span class="chip" id="reloj"></span><span class="chip" id="total"></span></div>
</header>
<div style="background:#fff3cd;color:#664d03;padding:6px 12px;font-size:13px;border-bottom:1px solid #ffe69c"><b>VISTA PREVIA:</b> así se verá la ronda. Los registros no se envían a ningún sitio: al guardar se descarga un archivo CSV.</div>
<main>
  <div class="quien" id="quien"></div>
  <input class="buscar" id="q" type="search" placeholder="Buscar docente o grupo" oninput="pintar()">
  <div id="lista"><div class="aviso">Cargando…</div></div>
</main>
<div class="barra">
  <div class="cuenta" id="cuenta"></div>
  <button class="todos" onclick="todosPresentes()">Todos presentes</button>
  <button class="guardar" id="btnGuardar" onclick="guardar()">Guardar ronda</button>
</div>
<div class="toast" id="toast"></div>

},{"categoria":"FORTUITO","motivo":"Situación fortuita camino al trabajo","justificada":"SI","soporte_sugerido":"Constancia si la hay","requiere_soporte":"SI","plazo_dias":"5"},{"categoria":"OTRO","motivo":"Otro","justificada":"SI","soporte_sugerido":"Describir en observaciones","requiere_soporte":"SI","plazo_dias":"5"}],"listas":[{"lista":"tipo_novedad","valor":"Presente"},{"lista":"tipo_novedad","valor":"No asistió"},{"lista":"tipo_novedad","valor":"Llegada tarde"},{"lista":"tipo_novedad","valor":"Llegada tarde informada"},{"lista":"tipo_novedad","valor":"Salida temprana"},{"lista":"tipo_novedad","valor":"Salida temprana informada"},{"lista":"fuente","valor":"Coordinador(a)"},{"lista":"fuente","valor":"Docente ausente"},{"lista":"fuente","valor":"Estudiantes"},{"lista":"fuente","valor":"Otro docente"},{"lista":"fuente","valor":"Rector"},{"lista":"medio","valor":"Inspección ocular/Ronda supervisión"},{"lista":"medio","valor":"Reporte/Conversación con estudiantes"},{"lista":"medio","valor":"Llamada celular"},{"lista":"medio","valor":"WhatsApp directo"},{"lista":"medio","valor":"WhatsApp grupal"},{"lista":"medio","valor":"Formato Permiso Docente"},{"lista":"medio","valor":"Verbal"},{"lista":"medio","valor":"Copia incapacidad/licencia"},{"lista":"tipo_documento","valor":"Incapacidad médica"},{"lista":"tipo_documento","valor":"Constancia o cita médica"},{"lista":"tipo_documento","valor":"Epicrisis"},{"lista":"tipo_documento","valor":"Acta de defunción"},{"lista":"tipo_documento","valor":"Citación o invitación"},{"lista":"tipo_documento","valor":"Constancia de estudio"},{"lista":"tipo_documento","valor":"Remisión o pasajes"},{"lista":"tipo_documento","valor":"Otro soporte"}],"directivos":["Francisco Cortés","Coordinador 2","Coordinador 3","Rector"]};
(function(){
  var DIAS={Mon:'LUNES',Tue:'MARTES',Wed:'MIERCOLES',Thu:'JUEVES',Fri:'VIERNES',Sat:'SABADO',Sun:'DOMINGO'};
  function bogota(){
    var p={}; new Intl.DateTimeFormat('en-US',{timeZone:'America/Bogota',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false,
      year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
    var h=p.hour==='24'?'00':p.hour;
    return {dia:DIAS[p.weekday],hm:h+':'+p.minute,fecha:p.year+'-'+p.month+'-'+p.day};
  }
  function sesionAhora(hm){var s=null;DATOS.franjas.forEach(function(f){if(f.inicio<=hm&&hm<f.fin)s=f.hora;});return s;}
  function consultar(dia,sesion){
    var b=bogota(), auto=!dia&&!sesion; dia=dia||b.dia; var s=sesion?Number(sesion):sesionAhora(b.hm);
    var fr=DATOS.franjas.filter(function(f){return f.hora===s;})[0];
    var out={dia:dia,diaHoy:dia,sesion:s,auto:auto,hora:b.hm,fecha:b.fecha,franja:fr?fr.inicio+' - '+fr.fin:'',bloque:fr?fr.bloque:null,
      filas:[],motivos:DATOS.motivos,listas:DATOS.listas,directivos:DATOS.directivos,nota:s?'':(auto?'Descanso o fuera de jornada':'Sesión no válida')};
    if(!s) return out;
    out.filas=DATOS.horario.filter(function(h){return h.dia===dia&&Number(h.hora)===s;}).map(function(h){
      var enf=h.tipo==='ENFASIS', gc=enf?h.grupos_enfasis:h.grupo, d=DATOS.direccion[String(gc).split('+')[0]]||{};
      return {docente:h.docente,grupoCodigo:gc,
        grupo:enf?'ÉNFASIS '+String(gc).split('+').map(function(g){return DATOS.grupos[g]||g;}).join(' + '):(DATOS.grupos[gc]||gc),
        area:h.area||'(énfasis)',tipo:h.tipo,
        nota:[h.alternancia,h.equipo_enfasis?'Con: '+h.equipo_enfasis:''].filter(Boolean).join(' · '),
        dir:h.tipo==='AREAS_MULTIPLES'?'':(d.dir||''),modalidad:d.modalidad||'',previo:null};
    });
    return out;
  }
  function csv(p){
    var c=['fecha,dia,sesion,docente,grupo,area,estado,motivo,minutos,actividad,observaciones,directivo'];
    p.registros.forEach(function(r){c.push([p.fecha,p.dia,p.sesion,r.docente,r.grupoCodigo,r.area,r.estado,r.motivo,r.minutos,r.actividad,r.obs,p.directivo]
      .map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';}).join(','));});
    return c.join('\n');
  }
  var api=function(){var ok=null,fail=null,self={
    withSuccessHandler:function(f){ok=f;return self;},withFailureHandler:function(f){fail=f;return self;},
    urlBase:function(){setTimeout(function(){ok('');},0);},
    consultarSesion:function(d,s){setTimeout(function(){ok(consultar(d,s));},20);},
    guardarRonda:function(p){setTimeout(function(){
      var blob=new Blob(['\ufeff'+csv(p)],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download='ronda_'+p.fecha+'_S'+p.sesion+'.csv';document.body.appendChild(a);a.click();a.remove();
      ok({ok:true,guardados:p.registros.length});},20);}};return self;};
  window.google={script:{run:new Proxy({},{get:function(_,k){var s=api();return k in s?s[k]:s;}})}};
})();

<script>
var S = null;          // respuesta del servidor
var marcas = {};       // docente -> {estado, just, motivo, minutos, obs}
var diaSel = null, sesSel = null;
var ESTADOS=['Presente','No asistió','Llegada tarde','Salida temprana'];
var ICONOS={'Presente':'✔','No asistió':'✖','Llegada tarde':'⏰','Salida temprana':'↩'};

function el(id){return document.getElementById(id);}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(t){var x=el('toast');x.textContent=t;x.style.display='block';setTimeout(function(){x.style.display='none';},2600);}
function dirActual(){try{return localStorage.getItem('icet_directivo')||'';}catch(e){return '';}}
function setDir(v){try{localStorage.setItem('icet_directivo',v);}catch(e){} }

function cargar(dia, ses){
  el('lista').innerHTML='<div class="aviso">Cargando…</div>';
  google.script.run.withSuccessHandler(function(r){
    S=r; marcas={};
    r.filas.forEach(function(f){
      if(f.previo){
        var m=null; r.motivos.forEach(function(x){ if(x.motivo===f.previo.motivo) m=x; });
        marcas[f.docente]={estado:f.previo.estado, just:m?(m.justificada==='SI'?'Con':'Sin'):'Sin',
          motivo:f.previo.motivo||'', minutos:f.previo.minutos||'', obs:f.previo.observaciones||''};
      }
    });
    diaSel=r.dia; sesSel=r.sesion;
    el('dia').value=r.dia; el('sesion').textContent=r.sesion?('Sesión '+r.sesion):'Descanso';
    el('franja').textContent=r.franja||r.nota; el('reloj').textContent='Hora: '+r.hora;
    el('total').textContent=r.filas.length+' docentes';
    pintarQuien(); pintar();
  }).withFailureHandler(function(e){el('lista').innerHTML='<div class="aviso">Error: '+esc(e.message||e)+'</div>';}).consultarSesion(dia||null, ses||null);
}
function ahora(){cargar(null,null);}
function mover(d){
  var n=(sesSel||0)+d; if(n<1) n=1; if(n>8) n=8;
  cargar(diaSel, n);
}
function cambiaDia(){ cargar(el('dia').value, sesSel||1); }

function pintarQuien(){
  var d=dirActual();
  el('quien').innerHTML='<label><b>Ronda a cargo de:</b><select class="sel" style="margin-top:4px" onchange="setDir(this.value)">'+
    opt('','— Elegir directivo —',!d)+S.directivos.map(function(n){return opt(n,n,n===d);}).join('')+'</select></label>';
}

function grupos(){
  var q=el('q').value.toLowerCase(), g={}, orden=[];
  S.filas.forEach(function(f){
    if((f.docente+' '+f.grupo+' '+f.area).toLowerCase().indexOf(q)<0) return;
    if(!g[f.grupo]){g[f.grupo]=[];orden.push(f.grupo);}
    g[f.grupo].push(f);
  });
  return {g:g,orden:orden};
}

function pintar(){
  if(!S) return;
  if(!S.filas.length){ el('lista').innerHTML='<div class="aviso">'+esc(S.nota||'No hay docentes con clase en esta sesión.')+'</div>'; cuenta(); return; }
  var G=grupos(), h='';
  G.orden.forEach(function(nombre){
    var fs=G.g[nombre], ens=fs[0].tipo==='ENFASIS';
    var dr=fs[0].dir?'Dir. de grupo: '+fs[0].dir:'', mod=fs[0].modalidad?' · '+fs[0].modalidad:'';
    h+='<section class="grupo"><h2>'+esc(nombre)+'<small>'+(ens?'equipo de '+fs.length:'')+'</small></h2>'+
       ((dr||mod)?'<div class="dirgrupo">'+esc(dr+mod)+'</div>':'');
    fs.forEach(function(f){ h+=tarjeta(f); });
    h+='</section>';
  });
  el('lista').innerHTML=h||'<div class="aviso">Sin resultados</div>';
  cuenta();
}

function opt(v,t,sel){return '<option value="'+esc(v)+'"'+(sel?' selected':'')+'>'+esc(t)+'</option>';}

function tarjeta(f){
  var m=marcas[f.docente]||{}, k=esc(f.docente), id=idDe(f.docente);
  var h='<div class="doc estado-'+({'Presente':'Presente','No asistió':'No'}[m.estado]||(m.estado?'Tarde':''))+'" id="d_'+id+'">'+
    '<div class="nombre">'+k+'</div><div class="meta">'+esc(f.area)+'</div>'+
    (f.nota?'<div class="nota">'+esc(f.nota)+'</div>':'')+
    (f.reporte?'<div class="reporte"><b>Reportado hoy:</b> '+esc(f.reporte.tipo)+(f.reporte.motivo?' · '+esc(f.reporte.motivo):'')+(f.reporte.texto?' — “'+esc(f.reporte.texto)+'”':'')+(f.reporte.medio?' ('+esc(f.reporte.medio)+')':'')+(f.reporte.jornada?' · jornada completa':'')+'</div>':'')+
    (f.previo?'<div class="previo">Ya registrado: '+esc(f.previo.estado)+(f.previo.motivo?' · '+esc(f.previo.motivo):'')+'</div>':'')+
    '<select class="sel est" aria-label="Asistencia de '+k+'" onchange="marcar(\''+id+'\',this.value)">'+
      opt('','— Asistencia —',!m.estado)+
      ESTADOS.map(function(e){return opt(e,ICONOS[e]+' '+e,m.estado===e);}).join('')+
    '</select>';
  if(m.estado && m.estado!=='Presente') h+=detalle(id,m);
  return h+'</div>';
}

/* Controles de la novedad: los que no corresponden quedan desactivados */
function detalle(id,m){
  var noAsistio=m.estado==='No asistió', conJust=m.just==='Con';
  var h='<div class="detalle"><div class="rej">';
  h+='<label>Justificación<select class="sel" onchange="campo(\''+id+'\',\'just\',this.value,true)">'+
     opt('Sin','Sin justificación',m.just!=='Con')+opt('Con','Con justificación',conJust)+'</select></label>';
  var cats={}, ord=[];
  S.motivos.forEach(function(x){ if(x.justificada==='SI'){ if(!cats[x.categoria]){cats[x.categoria]=[];ord.push(x.categoria);} cats[x.categoria].push(x.motivo);} });
  h+='<label>Motivo<select class="sel" '+(conJust?'':'disabled')+' onchange="campo(\''+id+'\',\'motivo\',this.value)">'+
     opt('',conJust?'— Elegir motivo —':'(no aplica)',!m.motivo||!conJust)+
     ord.map(function(c){return '<optgroup label="'+esc(c)+'">'+cats[c].map(function(mo){return opt(mo,mo,m.motivo===mo);}).join('')+'</optgroup>';}).join('')+
     '</select></label>';
  h+='<label>Minutos'+(noAsistio?' (sesión completa)':'')+'<select class="sel" '+(noAsistio?'disabled':'')+' onchange="campo(\''+id+'\',\'minutos\',this.value)">'+
     opt('',noAsistio?'45':'— Elegir —',!m.minutos||noAsistio)+[5,10,15,20,30,45].map(function(x){return opt(x,x+' min',Number(m.minutos)===x&&!noAsistio);}).join('')+'</select></label>';
  h+='<label>Dejó actividad de aprendizaje<select class="sel" onchange="campo(\''+id+'\',\'actividad\',this.value)">'+
     ['N/A','Sí','No'].map(function(x){return opt(x,x,(m.actividad||'N/A')===x);}).join('')+'</select></label>';
  h+='</div><label>Observaciones<input type="text" class="obs" value="'+esc(m.obs||'')+'" oninput="campo(\''+id+'\',\'obs\',this.value,false)"></label></div>';
  return h;
}

function idDe(d){ return btoa(unescape(encodeURIComponent(d))).replace(/=/g,''); }
function nombrePorId(id){ return decodeURIComponent(escape(atob(id))); }
function marcar(id,estado){
  var d=nombrePorId(id), m=marcas[d]||{};
  if(!estado){ delete marcas[d]; pintar(); return; }
  m.estado=estado;
  if(estado==='Presente'){ m={estado:'Presente'}; }
  else { m.just=m.just||'Sin'; if(m.just==='Sin') m.motivo='Sin justificación'; if(estado==='No asistió') m.minutos=45; else if(Number(m.minutos)===45&&m.estado!=='No asistió') m.minutos=''; }
  marcas[d]=m; pintar();
}
function campo(id,k,v,repintar){
  var d=nombrePorId(id), m=marcas[d]||{}; m[k]=v;
  if(k==='just'){ m.motivo=(v==='Sin')?'Sin justificación':''; }
  marcas[d]=m;
  if(repintar) pintar(); else cuenta();
}
function todosPresentes(){
  S.filas.forEach(function(f){ if(!marcas[f.docente]||!marcas[f.docente].estado) marcas[f.docente]={estado:'Presente'}; });
  pintar();
}
function cuenta(){
  var n=0,no=0,t=0,p=0;
  S.filas.forEach(function(f){var m=marcas[f.docente]; if(m&&m.estado){n++; if(m.estado==='No asistió')no++; else if(m.estado!=='Presente')t++; else p++;}});
  el('cuenta').innerHTML='<b>'+n+'/'+S.filas.length+'</b> marcados · ✔'+p+' ✖'+no+' ⏰'+t;
}

function guardar(){
  var dir=dirActual();
  if(!dir){ toast('Elija quién hace la ronda'); window.scrollTo(0,0); return; }
  var regs=[], falta=null;
  S.filas.forEach(function(f){
    var m=marcas[f.docente]; if(!m||!m.estado) return;
    if(m.estado!=='Presente'){
      if(m.just==='Con'&&!m.motivo) falta=falta||f.docente+': elija el motivo';
      if((m.estado==='Llegada tarde'||m.estado==='Salida temprana')&&!m.minutos) falta=falta||f.docente+': elija los minutos';
    }
    regs.push({docente:f.docente,grupoCodigo:f.grupoCodigo,area:f.area,estado:m.estado,motivo:m.motivo||'',
      minutos:m.minutos||'',actividad:m.actividad||'N/A',obs:m.obs||''});
  });
  if(falta){ toast(falta); return; }
  if(!regs.length){ toast('No hay marcas para guardar'); return; }
  if(S.dia!==S.diaHoy){ toast('Solo se guarda la ronda del día de hoy ('+S.diaHoy+')'); return; }
  el('btnGuardar').disabled=true;
  google.script.run.withSuccessHandler(function(r){
    el('btnGuardar').disabled=false; toast('Guardado: '+r.guardados+' registros'); cargar(diaSel,sesSel);
  }).withFailureHandler(function(e){el('btnGuardar').disabled=false;toast('Error: '+(e.message||e));})
  .guardarRonda({directivo:dir,dia:S.dia,sesion:S.sesion,fecha:S.fecha,registros:regs});
}
try{ google.script.run.withSuccessHandler(function(u){ if(u){var a=el('irPanel');a.href=u+'?p=panel';a.style.display='inline';} }).urlBase(); }catch(e){}
ahora();
</script>
