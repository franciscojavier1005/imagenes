<script>
/* Aviso del día: reuniones y actividades de hoy, sobre cualquier pantalla unos segundos. Fuente única: apps_script/recursos/aviso_dia.html
   (scripts/sincronizar_aviso.py la copia a las pantallas). Autor del sistema: Francisco Javier Cortés Cabezas. */
function avisoDia(forzar){
  try{
    if(!(window.PREVIEW||(typeof tokenGuardado==='function'&&tokenGuardado()))) return;
    if(!forzar){ var t=Number(localStorage.getItem('icet_aviso_t')||0); if(Date.now()-t<180000) return; }   // como máximo una vez cada 3 minutos en este teléfono
  }catch(e){}
  if(typeof srv!=='function') return;
  srv().withSuccessHandler(function(r){ try{ avisoDiaPintar(r,false); }catch(e){} }).withFailureHandler(function(){}).avisosHoy();
}
/* durante la jornada: cada 3 minutos revisa si una reunión entró en su ventana de recordatorio (parpadea y avisa una sola vez) */
function avisoVigilar(){
  try{ if(!(window.PREVIEW||(typeof tokenGuardado==='function'&&tokenGuardado()))||typeof srv!=='function'||document.hidden) return; }catch(e){ return; }
  srv().withSuccessHandler(function(r){ try{ avisoDiaPintar(r,true); }catch(e){} }).withFailureHandler(function(){}).avisosHoy();
}
function avisoYa(clave){ try{ var k='icet_av_'+clave; if(sessionStorage.getItem(k)) return true; sessionStorage.setItem(k,'1'); }catch(e){} return false; }
function avisoDiaPintar(r,soloUrgentes){
  if(!r) return;
  var items=[], parp=false;
  (r.reuniones||[]).forEach(function(x){
    if(x.estado==='pasada'&&x.registrados) return;                      // ya terminó y tiene asistencia: no estorba
    if(soloUrgentes){ if(!x.urgente||avisoYa(x.id+'|'+r.hoy+'|'+x.estado)) return; }
    else if(!x.avisarRonda&&!x.urgente&&!x.salidaEst) return;           // quien no quiso verla al comenzar la ronda, solo la ve en su recordatorio
    var urg=!!x.urgente&&x.estado!=='pasada'; if(urg) parp=true;
    var cl=x.estado==='pasada'?'falta':((x.estado==='ahora'||urg)?'ahora':'hoy');
    var ic=cl==='falta'?'⚠️':(cl==='ahora'?'🔥':'🔥');
    var et=x.estado==='pasada'?'FALTA REGISTRAR ASISTENCIA':(x.estado==='ahora'?'AHORA':(urg?'EN '+Math.max(0,x.minutosHasta)+' MIN':'HOY · PRIORIDAD ALTA'));
    items.push({c:cl,p:urg,h:avFila(ic,x.inicio+' – '+x.fin,et,cl,x.nombre,x)});
  });
  if(!soloUrgentes&&(r.ausentes||[]).length){
    var fm=function(f){ try{ return new Date(f+'T12:00:00').toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'}); }catch(e){ return f; } };
    var lin=r.ausentes.slice(0,8).map(function(a){
      var tx=a.jornada?'No asiste (toda la jornada)':(a.tipo==='Ausente temporal'?'Permiso por horas':(a.tipo==='Llegada tarde informada'?'Llega tarde':'Sale temprano'));
      return '<div style="margin-top:3px"><b>'+avEsc(a.corto||a.docente)+'</b> · '+avEsc(a.motivo||'sin motivo')+'<br><small>'+tx+(a.dias>1?' · del '+fm(a.desde)+' al '+fm(a.hasta)+' ('+a.dias+' días)':'')+(a.atiende?' · a cargo: '+avEsc(a.atiende):'')+(/^(Sí|No)$/.test(a.actividad||'')?' · actividad: '+avEsc(a.actividad):'')+'</small></div>';
    }).join('')+(r.ausentes.length>8?'<div style="margin-top:3px"><small>y '+(r.ausentes.length-8)+' más</small></div>':'');
    items.push({c:'aus',h:'<span class="av-ic">🧑‍🏫</span><div><b>Docentes ausentes hoy ('+r.ausentes.length+')</b>'+lin+'</div>'});
  }
  if(!soloUrgentes){
    (r.previas||[]).forEach(function(x){
      var f=String(x.fecha).split('-'), man=x.dias===1, cl=man?'man':'prox';
      items.push({c:cl,h:avFila(man?'⏰':'📅',x.inicio+' – '+x.fin,(man?'MAÑANA · PRIORIDAD MEDIA':'EN '+x.dias+' DÍAS · '+f[2]+'/'+f[1]),cl,x.nombre,x)});
    });
  (r.actividades||[]).forEach(function(a){
      items.push({c:'act',h:'<span class="av-ic">🚌</span><div><b>'+avEsc(a.motivo)+'</b><br><small>Con estudiantes fuera del colegio: '+avEsc(a.docentes.slice(0,4).join(', '))+(a.docentes.length>4?' y '+(a.docentes.length-4)+' más':'')+' · no se marca ausentes</small></div>'});
    });
  }
  if(!items.length) return;
  items.sort(function(a,b){ return (b.p?1:0)-(a.p?1:0); });             // las urgentes primero
  if(!soloUrgentes){ try{ localStorage.setItem('icet_aviso_t',String(Date.now())); }catch(e){} }
  var viejo=document.getElementById('avisoDia'); if(viejo) viejo.remove();
  var v=document.createElement('div'); v.id='avisoDia'; v.setAttribute('role','status'); v.setAttribute('aria-live','polite');
  var seg=Math.min(parp?32:28,(parp?14:10)+items.length*4);   // 10 segundos y 4 más por cada aviso (14 si hay algo urgente; máximo 28 o 32)
  v.innerHTML='<div class="av-caja'+(parp?' av-parp':'')+'"><div class="av-tit"><span>'+(parp?'🔔 Recordatorio':'📌 Hoy en el colegio')+'</span><button type="button" class="av-x" aria-label="Cerrar">✕</button></div>'+
    items.slice(0,6).map(function(i){return '<div class="av-it av-'+i.c+(i.p?' av-parpi':'')+'">'+i.h+'</div>';}).join('')+(items.length>6?'<div class="av-mas">y '+(items.length-6)+' más en Reuniones</div>':'')+
    '<div class="av-barra"><div class="av-prog" style="animation-duration:'+seg+'s"></div></div><div class="av-pie">Toque para cerrar · se cierra solo en unos segundos</div></div>';
  var st=document.createElement('style'); st.textContent=
   '#avisoDia{position:fixed;left:0;right:0;top:12px;z-index:9999;display:flex;justify-content:center;padding:0 10px;pointer-events:none}'+
   '#avisoDia .av-caja{pointer-events:auto;background:#fff;border:2px solid #0f2a5c;border-radius:14px;box-shadow:0 8px 28px rgba(10,20,40,.45);max-width:460px;width:100%;padding:10px 12px;animation:avEntra .25s ease-out}'+
   '@keyframes avEntra{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}@keyframes avProg{from{width:100%}to{width:0}}'+
   '@keyframes avParp{0%,100%{background:#fff1e0;box-shadow:0 0 0 0 rgba(239,108,0,.0)}50%{background:#ffd54f;box-shadow:0 0 0 5px rgba(239,108,0,.55)}}'+
   '@keyframes avBorde{0%,100%{border-color:#0f2a5c}50%{border-color:#ef6c00}}'+
   '#avisoDia .av-parp{animation:avEntra .25s ease-out,avBorde .9s ease-in-out infinite}#avisoDia .av-parpi{animation:avParp .9s ease-in-out infinite}'+
   '#avisoDia .av-tit{font-weight:800;color:#0f2a5c;font-size:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}'+
   '#avisoDia .av-x{border:0;background:#e6edf5;border-radius:8px;width:30px;height:30px;font-weight:800;color:#234;font-size:14px}'+
   '#avisoDia .av-it{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;margin:4px 0;border-radius:9px;background:#eef3fa;border-left:5px solid #1b4a8f;font-size:14px;color:#1d2a3a;line-height:1.3}'+
   '#avisoDia .av-ahora{background:#fff1e0;border-left-color:#ef6c00}#avisoDia .av-falta{background:#fdeeee;border-left-color:#c62828}#avisoDia .av-act{background:#e8f5e9;border-left-color:#2e7d32}#avisoDia .av-aus{background:#fdeeee;border-left-color:#c62828}'+
   '#avisoDia .av-ic{font-size:20px}#avisoDia small{color:#456}#avisoDia .av-e{border-radius:8px;padding:0 6px;font-size:11px;color:#fff;margin-left:4px}'+
   '#avisoDia .av-e.av-ahora{background:#ef6c00}#avisoDia .av-e.av-falta{background:#c62828}#avisoDia .av-e.av-prox{background:#1b4a8f}'+
   '#avisoDia .av-obs{font-size:12.5px;color:#234;margin-top:2px;white-space:pre-wrap}#avisoDia .av-mas{font-size:12.5px;color:#456;margin:2px 0}#avisoDia .av-barra{height:4px;background:#e3e9f0;border-radius:3px;margin-top:6px;overflow:hidden}'+
   '#avisoDia .av-prog{height:100%;background:#0f2a5c;animation-name:avProg;animation-timing-function:linear;animation-fill-mode:forwards}#avisoDia .av-pie{font-size:11px;color:#789;text-align:center;margin-top:3px}'+
   '#avisoDia .av-cuerpo{flex:1;min-width:0}#avisoDia .av-linea{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:2px}'+
   '#avisoDia .av-nom{font-weight:800;font-size:16px;line-height:1.2;color:#0b1f4a;margin:1px 0 2px}'+
   '#avisoDia .av-hora{font-weight:800;font-size:14px;border-radius:8px;padding:1px 8px;color:#fff;background:#1b4a8f}'+
   '#avisoDia .av-et{font-weight:800;font-size:11px;letter-spacing:.2px}'+
   '#avisoDia .av-h-hoy{background:#ef6c00}#avisoDia .av-e-hoy{color:#c2410c}'+
   '#avisoDia .av-h-ahora{background:#d84315}#avisoDia .av-e-ahora{color:#bf360c}'+
   '#avisoDia .av-h-man{background:#b58900}#avisoDia .av-e-man{color:#8a6a00}'+
   '#avisoDia .av-h-prox{background:#1b4a8f}#avisoDia .av-e-prox{color:#0f2a5c}'+
   '#avisoDia .av-h-falta{background:#c62828}#avisoDia .av-e-falta{color:#a31515}'+
   '#avisoDia .av-hoy{background:#fff1e0;border-left-color:#ef6c00}#avisoDia .av-man{background:#fffbe3;border-left-color:#f0c000}#avisoDia .av-prox{background:#e8eefb;border-left-color:#1b4a8f}'+
   '@media(prefers-reduced-motion:reduce){#avisoDia .av-parp,#avisoDia .av-parpi{animation:none}}';
  v.appendChild(st); document.body.appendChild(v);
  if(parp){ try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){} }
  var cierra=function(){ if(v.parentNode) v.parentNode.removeChild(v); }, timer=setTimeout(cierra,seg*1000);
  v.querySelector('.av-caja').addEventListener('click',function(){ clearTimeout(timer); cierra(); });
}
/* una fila del aviso: icono de prioridad, hora destacada (con color), nombre en negrita y un poco más grande, y el detalle */
function avFila(ic,hora,etiqueta,cl,nombre,x){
  var det=avEsc(x.tipo)+(x.lugar?' · 📍 '+avEsc(x.lugar):'')+(x.finTipo==='JORNADA'?' · hasta finalizar la jornada':'')+(x.sinEstudiantes?' · <b>sin clases</b> (se suspende la ronda de aula)':'')+(x.convocadosResumen?' · convoca a: '+avEsc(x.convocadosResumen):(x.convocadosN?' · convocados: '+x.convocadosN:''));
  return '<span class="av-ic">'+ic+'</span><div class="av-cuerpo"><div class="av-linea"><span class="av-hora av-h-'+cl+'">'+avEsc(hora)+'</span><span class="av-et av-e-'+cl+'">'+avEsc(etiqueta)+'</span></div>'+
    '<div class="av-nom">'+avEsc(nombre)+'</div><small>'+det+'</small>'+(x.observaciones?'<div class="av-obs">📝 '+avEsc(x.observaciones)+'</div>':'')+avExtra(x)+'</div>';
}
/* salida anticipada de estudiantes y comunicación a padres */
function avExtra(x){
  var h='';
  if(x.salidaEst) h+='<div class="av-obs">🚸 Los estudiantes salen a las <b>'+avEsc(x.salidaEst)+'</b> (clases hasta las '+avEsc(x.finClases)+(x.llevarComedor?'; llevar al comedor antes de despacharlos':'')+')</div>';
  if(x.informarPadres) h+='<div class="av-obs">📣 Informar a los docentes, estudiantes y padres de familia (grupos de WhatsApp) desde el comienzo de la jornada</div>';
  return h;
}
function avEsc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
if(!window.AVISO_MANUAL) setTimeout(function(){ avisoDia(false); },1200);
setInterval(avisoVigilar,180000);   // recordatorios durante la jornada
</script>
