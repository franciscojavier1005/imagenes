<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vista previa 3 · opciones minimalistas</title>
<style>
:root{--azul:#0b2350;--azul2:#1b4a8f;--amar:#f2b705;--borde:#d7deea}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#e9eef6;color:#1c2b3f}
.top{padding:10px 14px;background:#fff8e1;border-bottom:1px solid #f0d98a;font-size:14px}
.wrap{display:flex;flex-wrap:wrap;gap:22px;padding:18px;justify-content:center;align-items:flex-start}
.fr{background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(11,35,80,.2);overflow:hidden;position:relative;display:flex;flex-direction:column}
.fr>h4{margin:0;padding:6px 12px;font-size:12.5px;background:#dfe7f3;color:#234;flex:none}
.tel{width:390px;height:780px}.pc{width:1180px;height:560px}
.in{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
/* encabezado */
header{flex:none;background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;padding:5px 8px 6px;border-bottom:3px solid var(--amar);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id clk" "nav nav";gap:5px 8px;align-items:center}
.idb{grid-area:id;display:flex;gap:8px;align-items:center;min-width:0}.idb img{width:30px;height:29px;border-radius:6px;background:#fff}
.tit{min-width:0}.tit b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tit small{display:none}
.clkb{grid-area:clk;display:flex;gap:6px;align-items:center}.dirc{font-size:11.5px;background:#c62828;border-radius:999px;padding:3px 9px}
.reloj{font:700 14px/1 ui-monospace,Consolas,monospace;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 6px}
.navb{grid-area:nav;display:grid;grid-template-columns:repeat(3,32px) 28px 1fr 28px 54px 50px;gap:5px;align-items:center}
.navb>*{white-space:nowrap;overflow:hidden;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px}
.navb .n{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4)}.navb .f{background:var(--amar);color:#3b2a00}
.navb .b{background:#fff;color:var(--azul)}.navb .s{background:#fff;color:#1c2b3f}.navb .a{background:var(--amar);color:#3b2a00}
/* pie de una fila */
footer{flex:none;background:#fff;border-top:2px solid var(--borde);padding:5px 8px;display:flex;gap:6px;align-items:center}
footer .c{font-size:11.5px;font-weight:800;display:flex;gap:6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
footer .c span{background:#eef2f8;border-radius:999px;padding:2px 8px}footer .c .f{background:#ffb300}
footer button{flex:none;white-space:nowrap;height:32px;border:0;border-radius:8px;font-weight:800;font-size:12.5px;padding:0 10px}
.vt{background:#e5f4e8;color:#1b5e20}.gu{background:#ef6c00;color:#fff}
.lista{flex:1;overflow:hidden;background:#fff}
/* ===== OPCIÓN 1: lista de una línea con 3 botones ===== */
.o1 .row{display:grid;grid-template-columns:34px 1fr 38px 38px 34px;gap:5px;align-items:center;padding:0 8px;height:40px;border-bottom:1px solid #edf0f5}
.o1 .g{font-size:11px;color:#678;font-weight:700}.o1 .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o1 button{height:28px;border-radius:7px;border:1.5px solid;font-weight:800;font-size:14px;background:#fff;padding:0}
.ok{border-color:#a5d6a7;color:#1b5e20}.no{border-color:#ef9a9a;color:#a31515}.mas{border-color:#cfd8e6;color:#456}
.row.sP{background:#eaf6ea}.row.sP .ok{background:#2e7d32;color:#fff;border-color:#2e7d32}
.row.sN{background:#fdeeee}.row.sN .no{background:#c62828;color:#fff;border-color:#c62828}
.row.sT{background:#fff4e0}.row.sT .mas{background:#ef8f00;color:#fff;border-color:#ef8f00}
/* ===== OPCIÓN 2: círculo de presente + estado ===== */
.o2 .row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:0 10px;height:42px;border-bottom:1px solid #edf0f5}
.o2 .ck{width:26px;height:26px;border-radius:50%;border:2px solid #a5d6a7;background:#fff;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px}
.o2 .sP .ck{background:#2e7d32;border-color:#2e7d32}.o2 .nm{font-size:13.5px;font-weight:600;line-height:1.1}.o2 .nm small{display:block;font-size:11px;color:#678;font-weight:500}
.o2 .est{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;border:1.5px dashed #b9c4d6;color:#567;background:#fff}
.o2 .sN .est{background:#c62828;color:#fff;border:0}.o2 .sT .est{background:#ef8f00;color:#fff;border:0}.o2 .sP .est{display:none}
.o2 .sN{background:#fdeeee}.o2 .sT{background:#fff4e0}.o2 .sP{background:#eaf6ea}
/* ===== OPCIÓN 3: solo excepciones ===== */
.o3 .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:0 10px;height:34px;border-bottom:1px solid #edf0f5}
.o3 .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.o3 .nm small{color:#789;font-size:11px;margin-left:5px}
.o3 .chip{font-size:12px;font-weight:800;border-radius:7px;padding:4px 10px;background:#eef2f8;color:#456;border:1px solid #d3dbe8}
.o3 .sN .chip{background:#c62828;color:#fff;border-color:#c62828}.o3 .sT .chip{background:#ef8f00;color:#fff;border-color:#ef8f00}.o3 .sS .chip{background:#5e35b1;color:#fff;border-color:#5e35b1}
.o3 .sN{background:#fdeeee}.o3 .sT{background:#fff4e0}.o3 .sS{background:#f1ecfa}
.o3 .barra{flex:none;display:flex;gap:6px;padding:6px 8px;background:#f4f7fb;border-bottom:1px solid var(--borde)}
.o3 .barra button{flex:1;height:32px;border-radius:8px;border:0;font-weight:800;background:#e5f4e8;color:#1b5e20;font-size:13px}
/* hoja inferior */
.vel{position:absolute;inset:0;background:rgba(10,20,40,.45)}
.hoja{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:10px 12px 14px}
.hoja h5{margin:0 0 8px;font-size:14px}.hoja .g8{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.hoja .g8 div{height:38px;border-radius:9px;border:2px solid;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.c1{border-color:#a5d6a7;background:#f1faf1;color:#1b5e20}.c2{border-color:#ef9a9a;background:#fdf1f1;color:#a31515}.c3{border-color:#80cbc4;background:#eefaf9;color:#00695c}.c4{border-color:#b39ddb;background:#f4f0fb;color:#4527a0}
.c5{border-color:#9fa8da;background:#f1f2fb;color:#303f9f}.c6{border-color:#ffcc80;background:#fff7ea;color:#8a5a00}.c7{border-color:#90caf9;background:#eef6fe;color:#01579b}.c8{border-color:#ce93d8;background:#faf0fc;color:#6a1b9a}
/* ===== OPCIÓN 4: tabla de escritorio ===== */
.pc header{grid-template-columns:auto 1fr auto;grid-template-areas:"id nav clk";gap:14px;padding:6px 14px}
.pc .navb{display:flex;gap:6px;justify-content:center}.pc .navb>*{padding:0 12px}.pc .navb .b{width:190px}.pc .navb .s{width:70px}.pc .navb .f{width:34px;padding:0}.pc .tit small{display:block;font-size:11.5px;opacity:.9}.pc .tit b{font-size:16px}
.tabla{flex:1;overflow:hidden}
.th,.tr{display:grid;grid-template-columns:70px 1.5fr 1fr repeat(8,60px);align-items:center;gap:4px;padding:0 12px}
.th{height:34px;background:#edf1f8;font-size:11.5px;font-weight:800;color:#345;border-bottom:1px solid var(--borde)}.th span{text-align:center}.th span:nth-child(-n+3){text-align:left}
.tr{height:30px;border-bottom:1px solid #edf0f5;font-size:13px}.tr:nth-child(even){background:#f8fafd}
.tr .gr{font-weight:700;color:#678;font-size:12px}.tr .ar{color:#678;font-size:12px}
.tr i{font-style:normal;height:24px;border-radius:6px;border:1.5px solid;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:#fff}
.tr.sP{background:#eaf6ea}.tr.sP .i1{background:#2e7d32;color:#fff;border-color:#2e7d32}.tr.sN{background:#fdeeee}.tr.sN .i2{background:#c62828;color:#fff;border-color:#c62828}
.i1{border-color:#a5d6a7;color:#1b5e20}.i2{border-color:#ef9a9a;color:#a31515}.i3{border-color:#80cbc4;color:#00695c}.i4{border-color:#b39ddb;color:#4527a0}.i5{border-color:#9fa8da;color:#303f9f}.i6{border-color:#ffcc80;color:#8a5a00}.i7{border-color:#90caf9;color:#01579b}.i8{border-color:#ce93d8;color:#6a1b9a}
.leg{flex:none;padding:5px 14px;font-size:12px;background:#fff8e1;border-top:1px solid #f0d98a;color:#5a4a00}
.pc footer .c{font-size:13px}.pc footer button{padding:0 16px;height:34px}
</style></head><body>
