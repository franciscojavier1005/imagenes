<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vista previa 2 · ronda compacta</title>
<style>
:root{--azul:#0b2350;--azul2:#1b4a8f;--amar:#f2b705;--borde:#cfd8e6}
*{box-sizing:border-box}html,body{margin:0}body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#eef2f8;color:#1c2b3f;padding-bottom:62px}
/* ---- encabezado compacto ---- */
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;padding:5px 8px 6px;border-bottom:3px solid var(--amar);display:grid;grid-template-columns:1fr auto;grid-template-areas:"id clk" "nav nav";gap:5px 8px;align-items:center}
.idb{grid-area:id;display:flex;gap:8px;align-items:center;min-width:0}.idb img{width:34px;height:33px;border-radius:7px;background:#fff;flex:none}
.tit{min-width:0}.tit b{display:block;font-size:13.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tit small{display:none}
.clkb{grid-area:clk;display:flex;gap:6px;align-items:center}
.dirc{font-size:11.5px;background:#c62828;border-radius:999px;padding:4px 9px;white-space:nowrap}
.reloj{font:700 14px/1 ui-monospace,Consolas,monospace;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 6px}
.navb{grid-area:nav;display:grid;grid-template-columns:repeat(3,34px) 30px 1fr 30px 56px 52px;gap:5px;align-items:center}
.nav,.fl,.sel,.blq{height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.nav{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff}
.fl{background:var(--amar);color:#3b2a00}.blq{background:#fff;color:var(--azul);font-size:13.5px;gap:5px;white-space:nowrap}.blq small{display:none}
.sel{background:#fff;color:#1c2b3f;font-size:12.5px;padding:0 4px}.ahora{background:var(--amar);color:#3b2a00;font-size:12.5px}
.tx{display:none}
/* ---- tarjetas ---- */
main{padding:6px}
.t{background:#fff;border:1px solid var(--borde);border-left:5px solid #cfd8e6;border-radius:10px;padding:6px 8px 7px;margin-bottom:6px}
.t.ok{border-left-color:#2e7d32}.t.no{border-left-color:#c62828;background:#fff4f4}
.t .nom{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t .nom b{font-size:14.5px;line-height:1.15}.t .nom span{font-size:11.5px;color:#567;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:5px}
.seg button{height:31px;border-radius:7px;border:1.5px solid;font-weight:700;font-size:11.5px;letter-spacing:-.2px;padding:0 1px;white-space:nowrap;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px}
.seg .l{display:none}
.b1{border-color:#a5d6a7;background:#f1faf1;color:#1b5e20}.b2{border-color:#ef9a9a;background:#fdf1f1;color:#a31515}
.b3{border-color:#80cbc4;background:#eefaf9;color:#00695c}.b4{border-color:#b39ddb;background:#f4f0fb;color:#4527a0}
.b5{border-color:#9fa8da;background:#f1f2fb;color:#303f9f}.b6{border-color:#ffcc80;background:#fff7ea;color:#8a5a00}
.b7{border-color:#90caf9;background:#eef6fe;color:#01579b}.b8{border-color:#ce93d8;background:#faf0fc;color:#6a1b9a}
.t.ok .b1{background:#2e7d32;color:#fff;border-color:#2e7d32}.t.no .b2{background:#c62828;color:#fff;border-color:#c62828}
/* ---- pie compacto: 2 filas ---- */
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--borde);padding:4px 8px 5px;z-index:5}
.cont{display:flex;gap:5px;overflow:hidden;font-size:11.5px;font-weight:700;margin-bottom:4px}
.cont span{border-radius:999px;padding:2px 8px;white-space:nowrap;background:#eef2f8}
.cont .f{background:#ffb300;color:#3b2a00}.cont .g{background:#fff0c9;color:#7a4d00}
.acc{display:grid;grid-template-columns:36px 36px 1fr 1fr 1.4fr;gap:5px}
.acc button{height:34px;border-radius:9px;border:0;font-weight:800;font-size:13px}
.acc .n{background:#e8eef7}.acc .v{background:#e5f4e8;color:#1b5e20}.acc .l2{background:#fdecec;color:#a31515}.acc .gu{background:#ef6c00;color:#fff}
/* ---- computador ---- */
@media(min-width:900px){
 header{grid-template-columns:auto 1fr auto;grid-template-areas:"id nav clk";gap:14px;padding:7px 14px}
 .idb img{width:42px;height:41px}.tit b{font-size:17px}.tit small{display:block;font-size:12px;opacity:.9}
 .navb{display:flex;justify-content:center;gap:6px}
 .nav{width:104px}.nav .tx{display:inline;margin-left:4px}.fl{width:36px}.blq{width:190px}.blq small{display:inline}.sel{width:92px}.ahora{width:70px}
 .reloj{font-size:19px;padding:6px 10px}.dirc{font-size:12.5px;padding:5px 12px}
 main{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding:8px 14px;align-items:start}
 .t{margin:0}.t .nom b{font-size:15px}
 .seg{grid-template-columns:repeat(4,1fr)}.seg button{font-size:12.5px;height:31px}
 .seg .c{display:none}.seg .l{display:inline}
 footer{padding:6px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.cont{font-size:13px;margin:0}.cont span{padding:3px 11px}
 .acc{grid-template-columns:44px 44px 120px 120px 190px}
}
</style></head><body>
