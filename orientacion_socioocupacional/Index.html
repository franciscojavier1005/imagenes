function schedule(){
 if(!AU.mus||!AU.ctx||!AU.bus)return;
 var c=AU.ctx,bus=AU.bus;
 while(AU.next<c.currentTime+9){
  if(AU.style==='oceano'){
   var ch=PROG[AU.ci%PROG.length],t=AU.next,dur=9;
   ch.forEach(function(m,i){note(c,bus,m,t+i*.12,dur+2.5,.05,'triangle',false)});
   var hits=3+Math.floor(Math.random()*3);
   for(var k=0;k<hits;k++){var tt=t+1+Math.random()*(dur-2.5),mm=PENT[Math.floor(Math.random()*PENT.length)];note(c,bus,mm,tt,3.4,.07,'sine',true)}
   AU.next+=dur;AU.ci++;
  }else{
   var T={lofi:[LOFI,barLofi],synth:[SYN,barSyn],balada:[BAL,barBal],newwave:[NWV,barNwv]}[AU.style],bl=4*60/T[0].bpm;
   T[1](c,bus,AU.next,AU.ci);AU.next+=bl;AU.ci++;
  }
 }
 AU.timer=setTimeout(schedule,1500);
}
